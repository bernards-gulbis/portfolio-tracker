sonar.organization=bernards-gulbis
sonar.projectKey=bernards-gulbis_portfolio-tracker-v4

sonar.sources=web/src,api/app
sonar.tests=web/src,api/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test_*.py

# Coverage reports
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.python.coverage.reportPaths=api/coverage.xml

# Python version
sonar.python.version=3.12

# Auto-generated by ``openapi-typescript`` (see header in the file). The
# interface names (``paths``, ``components``, ``operations``) are produced
# by the tool and are required by consumers (web/src/api.ts), so we exclude
# the file from analysis instead of fighting the rule.
sonar.exclusions=web/src/api-generated.ts

# i18n locales mirror the same key shape across languages by design;
# Sonar's CPD treats this as duplication. Coverage still applies.
sonar.cpd.exclusions=web/src/i18n/locales/**
