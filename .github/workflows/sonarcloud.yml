name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Frontend tests & coverage ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run frontend tests with coverage
        run: npx vitest run --coverage --reporter=default
        working-directory: web

      # --- Backend tests & coverage ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest pytest-cov
        working-directory: api

      - name: Run backend tests with coverage
        run: pytest --cov=app --cov-report=xml:coverage.xml
        working-directory: api

      # --- API contract drift gate ---
      # Regenerate web/src/api-generated.ts from the live FastAPI OpenAPI
      # schema. If the committed file is stale, ``git diff --exit-code``
      # returns non-zero and CI fails. Forces backend↔frontend type sync
      # to be a deliberate commit, not a runtime surprise.
      - name: Regenerate OpenAPI TypeScript types
        run: npm run generate:api
        working-directory: web
      - name: Fail if api-generated.ts is out of date
        run: git diff --exit-code -- web/src/api-generated.ts

      # --- SonarQube scan ---
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
