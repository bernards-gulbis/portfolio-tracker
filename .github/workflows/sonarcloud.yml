name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Frontend tests & coverage ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run frontend tests with coverage
        run: npx vitest run --coverage --reporter=default
        working-directory: web

      # --- Backend tests & coverage ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest pytest-cov
        working-directory: api

      - name: Run backend tests with coverage
        run: pytest --cov=app --cov-report=xml:coverage.xml
        working-directory: api

      # --- SonarQube scan ---
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ai-project-debt-key
            -Dsonar.sources=web/src,api/app
            -Dsonar.tests=web/src,api/tests
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test_*.py
            -Dsonar.javascript.lcov.reportPaths=web/coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=api/coverage.xml
