[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "RUF002", # ambiguous unicode in docstrings (× is intentional)
    "RUF003", # ambiguous unicode in comments (× is intentional)
    "N818",   # exception names use "Exception" suffix by project convention
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
